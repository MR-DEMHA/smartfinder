<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartFinder | Tecnología, videojuegos, moda y hogar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- Header / Barra Superior -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-gradient-to-tr from-indigo-500 to-emerald-500 p-2.5 rounded-2xl text-white shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-compass text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-black tracking-tight bg-gradient-to-r from-indigo-400 via-emerald-400 to-teal-300 bg-clip-text text-transparent">
            SmartFinder
          </h1>
          <p class="text-xs text-slate-400 hidden sm:block">Catálogo de productos</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full font-semibold flex items-center">
          <span class="w-2 h-2 rounded-full bg-indigo-400 mr-2"></span>
          Catálogo sin productos
        </span>
      </div>
    </div>
  </header>

  <!-- Estado del catálogo -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="text-center mb-8">
      <h2 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight mb-3">
        Tienda temporalmente vacía
      </h2>
      <p class="text-slate-400 text-sm md:text-base max-w-2xl mx-auto">
        Hemos retirado todos los productos del catálogo.
      </p>
    </div>

    <div class="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center">
      <i class="fa-solid fa-box-open text-4xl text-indigo-400 mb-4" aria-hidden="true"></i>
      <p class="text-slate-300">Actualmente no hay productos disponibles.</p>
    </div>
  </main>
</body>
</html>
